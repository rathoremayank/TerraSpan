name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate website files
        run: |
          echo "✓ Validating website structure..."
          cd website/static
          
          # Check required HTML files
          required_files=("index.html" "features.html" "docs.html" "blog.html" "contact.html" "css/style.css" "js/main.js")
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file found"
            else
              echo "::error::Required file $file not found"
              exit 1
            fi
          done
          
          echo "✓ All website files validated"

      - name: List website contents
        run: |
          cd website/static
          echo "Website structure:"
          find . -type f
          echo ""
          du -sh .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/static'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    
    steps:
      - name: Deployment Notification
        run: |
          echo "::notice title=Website Deployed::TerraSpan website deployed to GitHub Pages"

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan on website
        continue-on-error: true
        run: |
          echo "🔒 Running security checks..."
          
          # Check for common security issues in HTML files
          if grep -r "onclick\|onerror\|onload" website/static/*.html 2>/dev/null; then
            echo "::warning::Found inline event handlers - consider using external event listeners for better security"
          else
            echo "✓ No obvious inline event handlers found"
          fi
          
          # Check for hardcoded credentials
          if grep -r "password\|secret\|api_key" website/static/ 2>/dev/null | grep -v "passphrase"; then
            echo "::error::Found potential credentials in website files"
            exit 1
          fi
          
          # Check for mixed content
          if grep -r "http://" website/static/*.html 2>/dev/null | grep -v "https://"; then
            echo "::warning::Found HTTP resources - consider using HTTPS"
          else
            echo "✓ No mixed HTTP/HTTPS content detected"
          fi
          
          echo "✓ Security scan complete"
