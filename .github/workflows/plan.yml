name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'

jobs:
  plan-aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Terraform Init - AWS Dev
        run: |
          cd infrastructure/aws/environments/dev
          terraform init -backend=false

      - name: Terraform Plan - AWS Dev
        id: plan-aws-dev
        run: |
          cd infrastructure/aws/environments/dev
          terraform plan -no-color > plan.txt 2>&1 || true
          cat plan.txt

      - name: Comment PR - AWS Dev Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/aws/environments/dev/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## AWS Dev Terraform Plan\n```\n' + plan + '\n```'
            });

  plan-azure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init - Azure Dev
        run: |
          cd infrastructure/azure/environments/dev
          terraform init -backend=false

      - name: Terraform Plan - Azure Dev
        id: plan-azure-dev
        run: |
          cd infrastructure/azure/environments/dev
          terraform plan -no-color > plan.txt 2>&1 || true
          cat plan.txt

  plan-gcp:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Terraform Init - GCP Dev
        run: |
          cd infrastructure/gcp/environments/dev
          terraform init -backend=false

      - name: Terraform Plan - GCP Dev
        id: plan-gcp-dev
        run: |
          cd infrastructure/gcp/environments/dev
          terraform plan -no-color > plan.txt 2>&1 || true
          cat plan.txt
